# WSO2 APIM 4.6.0 - overrides (template)
# Este archivo contiene solo overrides del chart oficial.
# Base oficial: APIM/wso2/values.base.yaml (release all-in-one-4.6.0-1).

image:
  # TODO: fijar tag 4.6.0
  tag: "4.6.0"

ingress:
  enabled: true
  hostname: apim-wso2.local
  tls:
    secretName: wso2-tls

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

# Vault Agent Injector (anotar deployments/pods en manifest del chart)
# Ruta sugerida: /vault/secrets/
# Archivo esperado: /vault/secrets/admin
vault:
  enabled: true
  mountPath: /vault/secrets

# TODO: configurar admin creds desde Vault (vía archivos inyectados)
# TODO: configurar OIDC/JWT según IdP

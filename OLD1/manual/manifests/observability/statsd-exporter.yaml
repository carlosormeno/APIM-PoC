# k8s/monitoring/statsd-exporter-corrected.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: statsd-mapping
  namespace: bi-orchestration
data:
  statsd_mapping.yml: |
    mappings:
    # DAG Run duration - airflow.dagrun.duration.<dag_id>.<run_id>
    - match: "airflow.dagrun.duration.*.*"
      name: "airflow_dagrun_duration_seconds"
      labels:
        dag_id: "$1"
        run_id: "$2"

    # DAG processing time - airflow.dag_processing.last_duration.<dag_file>
    - match: "airflow.dag_processing.last_duration.*"
      name: "airflow_dag_processing_last_duration_seconds"
      labels:
        dag_file: "$1"

    # Operator successes - airflow.operator_successes.<dag_id>.<task_id>
    - match: "airflow.operator_successes.*.*"
      name: "airflow_operator_successes_total"
      labels:
        dag_id: "$1"
        task_id: "$2"

    # Operator failures - airflow.operator_failures.<dag_id>.<task_id>
    - match: "airflow.operator_failures.*.*"
      name: "airflow_operator_failures_total"
      labels:
        dag_id: "$1"
        task_id: "$2"

    # Task duration - airflow.dag.*.*.duration
    - match: "airflow.dag.*.*.duration"
      name: "airflow_task_duration_seconds"
      labels:
        dag_id: "$1"
        task_id: "$2"

    # Task instance duration success - airflow.dagrun.*.*.*.duration
    - match: "airflow.dagrun.*.*.*.duration"
      name: "airflow_task_instance_duration_seconds"
      labels:
        dag_id: "$1"
        task_id: "$2"
        run_id: "$3"

    # Scheduler heartbeat
    - match: "airflow.scheduler.heartbeat"
      name: "airflow_scheduler_heartbeat"

    # DAG bag size
    - match: "airflow.dagbag_size"
      name: "airflow_dagbag_size"

    # Zombies killed
    - match: "airflow.scheduler.zombies_killed"
      name: "airflow_scheduler_zombies_killed_total"

    # Scheduler tasks - airflow.scheduler.tasks.*
    - match: "airflow.scheduler.tasks.*"
      name: "airflow_scheduler_tasks"
      labels:
        state: "$1"

    # Pool open slots
    - match: "airflow.pool.open_slots.*"
      name: "airflow_pool_open_slots"
      labels:
        pool: "$1"

    # Pool used slots
    - match: "airflow.pool.used_slots.*"
      name: "airflow_pool_used_slots"
      labels:
        pool: "$1"

    # Executor open slots
    - match: "airflow.executor.open_slots"
      name: "airflow_executor_open_slots"

    # Executor queued tasks
    - match: "airflow.executor.queued_tasks"
      name: "airflow_executor_queued_tasks"

    # Executor running tasks
    - match: "airflow.executor.running_tasks"
      name: "airflow_executor_running_tasks"

    # Custom Airflow Errors - airflow.custom_error.<error_type>.<dag_id>.<table_name>
    - match: "airflow.custom_error.*.*.*"
      name: "airflow_custom_error_total"
      labels:
        error_type: "$1"
        dag_id: "$2"
        table_name: "$3"

    # Catch-all para otras métricas de Airflow (útil para debugging)
    - match: "airflow.*"
      name: "airflow_unmatched"
      match_type: regex
      labels:
        metric_path: "$1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statsd-exporter
  namespace: bi-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statsd-exporter
  template:
    metadata:
      labels:
        app: statsd-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
    spec:
      containers:
      - name: statsd-exporter
        image: prom/statsd-exporter:v0.26.0
        ports:
        - containerPort: 9102
          name: metrics
        - containerPort: 9125
          name: statsd
          protocol: UDP
        args:
        - --statsd.mapping-config=/etc/statsd/statsd_mapping.yml
        - --statsd.cache-size=10000
        - --log.level=debug
        volumeMounts:
        - name: config
          mountPath: /etc/statsd
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: config
        configMap:
          name: statsd-mapping
---
apiVersion: v1
kind: Service
metadata:
  name: statsd-exporter
  namespace: bi-orchestration
  labels:
    app: statsd-exporter
spec:
  type: ClusterIP
  ports:
  - port: 9102
    name: metrics
    targetPort: 9102
  - port: 9125
    name: statsd
    targetPort: 9125
    protocol: UDP
  selector:
    app: statsd-exporter

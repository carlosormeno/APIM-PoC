apiVersion: apps/v1
kind: Deployment
metadata:
  name: wso2-postgres
  namespace: apim-wso2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wso2-postgres
  template:
    metadata:
      labels:
        app: wso2-postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "apim-wso2"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-inject-secret-postgres: "kv/apim/wso2/postgres"
        vault.hashicorp.com/agent-inject-template-postgres: |
          {{- with secret "kv/apim/wso2/postgres" -}}
          {{ .Data.data.password }}
          {{- end -}}
    spec:
      containers:
      - name: postgres
        image: postgres:16
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: wso2
        - name: POSTGRES_DB
          value: wso2_shared_db
        - name: POSTGRES_PASSWORD_FILE
          value: /vault/secrets/postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: wso2-postgres-pvc
      - name: init
        configMap:
          name: wso2-postgres-init
          items:
          - key: init.sql
            path: init.sql

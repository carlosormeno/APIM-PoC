apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  LEGACY_NOTE: |
    Este ConfigMap es LEGACY (Prometheus Deployment).
    Las reglas activas ahora viven en:
    - k8s/monitoring/prometheus-operator/prometheus-rules.yaml
  spark-airflow.rules: |
    groups:
    - name: spark
      rules:
      - alert: SparkMasterDown
        expr: up{job="spark-master"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Spark master no responde"
          description: "El target `spark-master` está `UP == 0`, lo que indica que el master no responde a los scrapes de Prometheus."
      - alert: SparkWorkerDown
        expr: up{job="spark-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Spark worker caído"
          description: "El job `spark-worker` ha dejado de responder (`up == 0`)."
      - alert: SparkWorkerDead
        expr: metrics_master_workers_Value - metrics_master_aliveWorkers_Value > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Workers reportados como muertos"
          description: "El master reporta más workers registrados ({metrics_master_workers_Value}) que vivos ({metrics_master_aliveWorkers_Value})."
      - alert: SparkAppFailed
        expr: up{job="spark-applications"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint de métricas de aplicaciones no disponible"
          description: "No se pudo scrapear el endpoint `/metrics/applications`; podría indicar que la aplicación Spark está en estado FAILED o simplemente no expone métricas."
      - alert: HighMemoryUsage
        expr: metrics_worker_memUsed_MB_Value / (metrics_worker_memUsed_MB_Value + metrics_worker_memFree_MB_Value) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memoria de worker alta"
          description: "Uso de memoria del worker (%) supera 85%: {{ $value | printf \"%.0f\" }}%. Ajusta memoria/escala si persiste."
      - alert: HighCpuUsage
        expr: metrics_worker_coresUsed_Value / (metrics_worker_coresUsed_Value + metrics_worker_coresFree_Value) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU de worker alta"
          description: "El uso de cores de worker supera el 85% ({{ $value | printf \"%.0f\" }}%). Revisa load o escala horizontal."
      - alert: SparkMasterJvmHeapHigh
        expr: metrics_jvm_heap_usage_Value{job="spark-master",type="gauges"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Spark Master usa demasiado heap"
          description: "El master reporta un uso de heap mayor al 80%. Verifica el uso de memoria de la JVM y ajusta `spark.driver.memory` o la GC si persiste."
      - alert: SparkWorkerJvmNonHeapHigh
        expr: metrics_jvm_non_heap_usage_Value{job="spark-worker",type="gauges"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Spark Worker con non-heap alto"
          description: "La JVM del worker está usando más del 90% del non-heap y puede causar `OutOfMemoryError` en la Metaspace o PermGen."
      - alert: SparkWorkerGcPauseHigh
        expr: increase(metrics_jvm_G1_Young_Generation_time_Value{job="spark-worker",type="gauges"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GC de worker consumiendo >1s en 5m"
          description: "La suma de pausas G1 Young GC del worker excede 1s en 5m. Revisa si hay demasiadas tareas cortas o ajusta los tamaños de heap."
      - alert: SparkMasterPendingApps
        expr: metrics_master_waitingApps_Value{job="spark-master",type="gauges"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Aplicaciones en cola en el master"
          description: "El master tiene aplicaciones esperando ser ejecutadas (`metrics_master_waitingApps_Value > 0`). Revisa recursos o la política de scheduling."
      - alert: SparkMasterNoAliveWorkers
        expr: metrics_master_aliveWorkers_Value{job="spark-master",type="gauges"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Spark sin workers vivos"
          description: "El master reporta cero workers vivos durante más de 3 minutos."
      - alert: SparkMasterAppsHigh
        expr: metrics_master_apps_Value{job="spark-master",type="gauges"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Muchas apps registradas en el master"
          description: "El master tiene más de 50 aplicaciones registradas. Ajusta el umbral según tu carga."
      - alert: SparkMasterWorkersLowRatio
        expr: (metrics_master_aliveWorkers_Value{job="spark-master",type="gauges"} / metrics_master_workers_Value{job="spark-master",type="gauges"}) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Baja proporción de workers vivos"
          description: "Menos del 50% de los workers están vivos. Verifica nodos o recursos."
      - alert: SparkWorkerNoExecutors
        expr: metrics_worker_executors_Value{job="spark-worker",type="gauges"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker sin executors"
          description: "Un worker no reporta executors activos durante más de 5 minutos."
      - alert: SparkWorkerMemoryFreeLow
        expr: metrics_worker_memFree_MB_Value{job="spark-worker",type="gauges"} / (metrics_worker_memFree_MB_Value{job="spark-worker",type="gauges"} + metrics_worker_memUsed_MB_Value{job="spark-worker",type="gauges"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memoria libre baja en worker"
          description: "La memoria libre del worker está por debajo del 10%. Ajusta recursos si persiste."
      - alert: SparkWorkerCoresFreeLow
        expr: metrics_worker_coresFree_Value{job="spark-worker",type="gauges"} / (metrics_worker_coresFree_Value{job="spark-worker",type="gauges"} + metrics_worker_coresUsed_Value{job="spark-worker",type="gauges"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cores libres bajos en worker"
          description: "Los cores libres del worker están por debajo del 10%. Considera escalar."
      - alert: SparkWorkerJvmDirectHigh
        expr: metrics_jvm_direct_used_Value{job="spark-worker",type="gauges"} / metrics_jvm_direct_capacity_Value{job="spark-worker",type="gauges"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memoria direct alta en worker"
          description: "El uso de memoria direct supera el 90% de su capacidad."
      - alert: SparkWorkerJvmHeapCommittedHigh
        expr: metrics_jvm_heap_committed_Value{job="spark-worker",type="gauges"} / metrics_jvm_heap_max_Value{job="spark-worker",type="gauges"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Heap committed alto en worker"
          description: "El heap committed supera el 90% del máximo disponible."
      - alert: SparkWorkerGcOldGenHigh
        expr: increase(metrics_jvm_G1_Old_Generation_time_Value{job="spark-worker",type="gauges"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GC Old Gen alto en worker"
          description: "Las pausas de GC Old Gen superan 1s en 5m. Ajusta heap/GC si persiste."
      - alert: SparkWorkerJvmMappedHigh
        expr: metrics_jvm_mapped_used_Value{job="spark-worker",type="gauges"} / metrics_jvm_mapped_capacity_Value{job="spark-worker",type="gauges"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memoria mapped alta en worker"
          description: "El uso de memoria mapped supera el 90% de su capacidad."
    - name: airflow
      rules:
      - alert: AirflowStatsdExporterDown
        expr: up{job="airflow-statsd"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "StatsD exporter de Airflow caído"
          description: "El target `airflow-statsd` no responde. Se pierden métricas de Airflow."
      - alert: AirflowDagbagEmpty
        expr: airflow_dagbag_size < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DagBag vacío o sin DAGs cargados"
          description: "No se detectan DAGs en el DagBag (`airflow_dagbag_size < 1`). Revisa el volumen de DAGs."
      - alert: AirflowExecutorQueuedTasksHigh
        expr: airflow_executor_queued_tasks > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cola de tareas alta en el executor"
          description: "El número de tareas en cola supera 50 durante más de 10 minutos. Revisa recursos y paralelismo."
      - alert: AirflowExecutorQueueStalled
        expr: airflow_executor_queued_tasks > 0 and airflow_executor_running_tasks == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tareas en cola sin ejecución"
          description: "Hay tareas en cola pero ninguna en ejecución. Verifica el scheduler y el executor."
      - alert: AirflowExecutorNoOpenSlots
        expr: airflow_executor_open_slots == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Executor sin slots disponibles"
          description: "No hay slots abiertos para ejecutar tareas. Considera escalar workers o pools."
      - alert: AirflowExecutorRunningTasksHigh
        expr: airflow_executor_running_tasks > 50
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Muchas tareas en ejecución"
          description: "El executor está ejecutando más de 50 tareas concurrentes. Monitorea recursos."
      - alert: AirflowSchedulerStarvingTasks
        expr: airflow_scheduler_tasks{state="starving"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scheduler con tareas starving"
          description: "Hay tareas en estado starving. Revisa dependencias, pools y recursos."
      - alert: AirflowSchedulerExecutableBacklog
        expr: airflow_scheduler_tasks{state="executable"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backlog de tareas ejecutables"
          description: "El scheduler acumula más de 100 tareas ejecutables. Revisa capacidad del executor."
      - alert: AirflowPoolOpenSlotsLow
        expr: sum(airflow_pool_open_slots) < 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pools con pocos slots abiertos"
          description: "Los pools de Airflow tienen menos de 5 slots disponibles. Revisa concurrencia o colas."
      - alert: AirflowStatsdUnmatchedMetrics
        expr: increase(airflow_unmatched_count[5m]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Métricas no mapeadas en StatsD"
          description: "El exporter reporta métricas sin mapear. Revisa la configuración de mapping en statsd-exporter."
      - alert: AirflowDagrunDurationP90High
        expr: airflow_dagrun_duration_seconds{quantile="0.9"} > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Duración p90 de DAG alta"
          description: "El p90 de duración de DAG supera 30m. Ajusta el umbral según la carga."
      - alert: AirflowDagrunDurationP99High
        expr: airflow_dagrun_duration_seconds{quantile="0.99"} > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Duración p99 de DAG alta"
          description: "El p99 de duración de DAG supera 60m."
      - alert: AirflowTaskDurationP90High
        expr: airflow_task_duration_seconds{quantile="0.9"} > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Duración p90 de tareas alta"
          description: "El p90 de duración de tareas supera 10m."
      - alert: AirflowTaskDurationP99High
        expr: airflow_task_duration_seconds{quantile="0.99"} > 1200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Duración p99 de tareas alta"
          description: "El p99 de duración de tareas supera 20m."
      - alert: AirflowSchedulerFailedTasks
        expr: airflow_scheduler_tasks{state="failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scheduler con tareas fallidas"
          description: "Se detectan tareas en estado failed."
      - alert: AirflowSchedulerRunningTasksHigh
        expr: airflow_scheduler_tasks{state="running"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Muchas tareas en ejecución (scheduler)"
          description: "El scheduler reporta más de 100 tareas en running."
      - alert: AirflowExecutorQueueGrowth
        expr: increase(airflow_executor_queued_tasks[10m]) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "La cola del executor crece rápido"
          description: "La cantidad de tareas en cola aumentó más de 50 en 10 minutos."
      - alert: AirflowExecutorOpenSlotsLow
        expr: airflow_executor_open_slots < 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pocos slots libres en el executor"
          description: "Quedan menos de 5 slots libres para ejecutar tareas."
      - alert: AirflowPoolOpenSlotsZero
        expr: min(airflow_pool_open_slots) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pool sin slots disponibles"
          description: "Al menos un pool no tiene slots disponibles."
      - alert: AirflowDagbagLarge
        expr: airflow_dagbag_size > 200
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "DagBag grande"
          description: "Se cargaron más de 200 DAGs en el DagBag. Ajusta el umbral según tu entorno."
      - alert: AirflowTableNotFound
        expr: increase(airflow_custom_error_total{error_type="table_not_found"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Tabla no encontrada en Oracle"
          description: "El DAG {{ $labels.dag_id }} se mandó a ejecutar pero durante su ejecución la tabla indicada {{ $labels.table_name }} no existe y el dag falló."
      - alert: AirflowMissingAuditColumns
        expr: increase(airflow_custom_error_total{error_type="missing_audit_columns"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Columnas de auditoría faltantes"
          description: "Error en {{ $labels.dag_id }}: No se encontraron columnas de fecha para el incremental de {{ $labels.table_name }}. Revisa los logs para ver las sugerencias."
      - alert: AirflowSparkJobFailed
        expr: increase(airflow_custom_error_total{error_type="spark_job_failed"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Fallo en ejecución de Spark"
          description: "El motor de Spark falló al procesar {{ $labels.table_name }} en el DAG {{ $labels.dag_id }}. Posible falta de recursos en Kubernetes."
    - name: minio
      rules:
      - alert: MinioClusterUnhealthy
        expr: minio_cluster_health_status != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MinIO reporta salud degradada"
          description: "El cluster de MinIO regresó un estado diferente a saludable (`minio_cluster_health_status != 1`)."
      - alert: MinioNodesOffline
        expr: minio_cluster_nodes_offline_total{job="minio"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nodos MinIO offline"
          description: "Hay nodos de MinIO offline (`minio_cluster_nodes_offline_total > 0`). Revisa conectividad y estado del cluster."
      - alert: MinioDrivesOffline
        expr: minio_cluster_drive_offline_total{job="minio"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Discos MinIO offline"
          description: "Se detectan discos offline en el cluster de MinIO. Verifica estado de almacenamiento."
      - alert: MinioCapacityLow
        expr: (minio_cluster_capacity_usable_free_bytes{job="minio"} / minio_cluster_capacity_usable_total_bytes{job="minio"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Capacidad baja en MinIO"
          description: "El espacio usable libre del cluster está por debajo del 15%. Considera ampliar almacenamiento o limpiar datos."
      - alert: MinioS3ErrorSpike
        expr: sum(rate(minio_s3_requests_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Errores S3 en MinIO"
          description: "Se detectan errores en las peticiones S3 sobre el cluster de MinIO; revisa la conectividad del bucket y las credenciales."
      - alert: MinioS3AuthRejected
        expr: sum(rate(minio_s3_requests_rejected_auth_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rechazos de autenticación S3"
          description: "Se detectan rechazos de autenticación S3. Valida credenciales y políticas de acceso."
      - alert: MinioAuditFailedMessages
        expr: increase(minio_audit_failed_messages[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fallos en auditoría MinIO"
          description: "MinIO reporta fallos al enviar mensajes de auditoría en los últimos 5 minutos."
      - alert: MinioWebhookFailedMessages
        expr: increase(minio_cluster_webhook_failed_messages[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fallos en webhooks de MinIO"
          description: "Hay fallos al enviar mensajes a webhooks configurados en MinIO."
      - alert: MinioOpenFileDescriptorsHigh
        expr: (minio_node_file_descriptor_open_total{job="minio"} / minio_node_file_descriptor_limit_total{job="minio"}) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Demasiados file descriptors abiertos"
          description: "El proceso de MinIO tiene más del 80% de sus file descriptors abiertos."
      - alert: MinioIlmExpiryBacklog
        expr: minio_node_ilm_expiry_pending_tasks{job="minio"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backlog de ILM en MinIO"
          description: "MinIO tiene tareas pendientes de expiración ILM por más de 15 minutos."
    - name: trino
      rules:
      - alert: TrinoHttp5xxSpike
        expr: sum(rate(io_airlift_http_client_httpclient_5xxresponse_fiveminute_rate[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Trino responde 5xx"
          description: "Las solicitudes HTTP del coordinador están devolviendo errores 5xx. Revisa los nodos worker y el backend de datos."
      - alert: TrinoExecutorBacklog
        expr: sum(io_airlift_discovery_client_announcer_executor_queuedtaskcount{}) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cola de ejecución de Trino saturada"
          description: "El executor del descubridor de nodos tiene más de 50 tareas en cola. Considera escalar nodos o revisar latencias de red."
      - alert: TrinoCoordinatorDown
        expr: up{job="trino-coordinator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Trino coordinator no responde"
          description: "El target `trino-coordinator` no responde a Prometheus."
      - alert: TrinoHttp5xxSpikeDetailed
        expr: max(io_airlift_http_client_httpclient_5xxresponse_fiveminute_rate{name=~"For.*"}) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Trino responde 5xx (detallado)"
          description: "Las solicitudes HTTP internas del coordinador devuelven errores 5xx de forma sostenida."
      - alert: TrinoLowOnThreads
        expr: io_airlift_http_server_httpserver_serverthreadpool_lowonthreads > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Trino con pocos threads disponibles"
          description: "El pool de threads del HTTP server está bajo presión."
      - alert: TrinoServerQueueBacklog
        expr: io_airlift_http_server_httpserver_serverthreadpool_queuesize > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backlog en cola del HTTP server"
          description: "El HTTP server de Trino tiene cola de tareas; revisa carga del coordinador."
      - alert: TrinoJvmHeapHigh
        expr: jvm_memory_bytes_used{area="heap"} / jvm_memory_bytes_max{area="heap"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Heap alto en Trino"
          description: "La JVM del coordinador usa más del 90% del heap."
      - alert: TrinoFailedQueries
        expr: trino_execution_querymanager_failedqueries_fiveminute_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consultas fallidas en Trino"
          description: "Se detectan consultas fallidas en los últimos 5 minutos."
      - alert: TrinoInternalFailures
        expr: trino_execution_querymanager_internalfailures_oneminute_rate > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fallas internas en Trino"
          description: "El coordinador reporta fallas internas recientes."
      - alert: TrinoAbandonedQueries
        expr: trino_execution_querymanager_abandonedqueries_fiveminute_rate > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Consultas abandonadas"
          description: "Se detectan consultas abandonadas en Trino."
      - alert: TrinoManagementExecutorQueued
        expr: trino_execution_sqlquerymanager_managementexecutor_queuedtaskcount > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cola alta en el ManagementExecutor"
          description: "El ManagementExecutor acumula tareas pendientes."
      - alert: TrinoS3GetFailures
        expr: sum(io_trino_filesystem_s3_s3filesystemstats_getobject_failures_fiveminute_count{name=~"hive|iceberg"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fallos de lectura S3 en Trino"
          description: "Se detectan fallos de GET en el filesystem S3 usado por Trino."
    - name: nessie
      rules:
      - alert: NessieDown
        expr: up{job="nessie"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nessie no responde"
          description: "El target de Nessie no responde a Prometheus."
      - alert: NessieHttp5xx
        expr: increase(http_server_requests_seconds_count{application="Nessie",status=~"5.."}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Errores HTTP 5xx en Nessie"
          description: "Se detectan respuestas 5xx en el servidor HTTP de Nessie."
      - alert: NessieHeapHigh
        expr: sum(jvm_memory_used_bytes{application="Nessie",area="heap"}) / sum(jvm_memory_max_bytes{application="Nessie",area="heap"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Heap alto en Nessie"
          description: "El heap de la JVM supera el 90% de uso."
      - alert: NessieCpuHigh
        expr: process_cpu_usage{application="Nessie"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU alta en Nessie"
          description: "El uso de CPU del proceso de Nessie supera el 85% de forma sostenida."
      - alert: NessieCacheMissRatioHigh
        expr: sum(rate(cache_gets_total{application="Nessie",cache="nessie-objects",result="miss"}[5m])) / sum(rate(cache_gets_total{application="Nessie",cache="nessie-objects"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Altos misses en cache de Nessie"
          description: "El ratio de cache misses en Nessie supera el 20%."
      - alert: NessieCacheNearCapacity
        expr: cache_weight_bytes{application="Nessie",cache="nessie-objects"} / cache_capacity_bytes{application="Nessie",cache="nessie-objects"} > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache de objetos cerca de capacidad"
          description: "La cache de objetos de Nessie supera el 90% de su capacidad."
      - alert: NessieCacheEvictions
        expr: increase(cache_evictions_count{application="Nessie",cache="nessie-objects"}[10m]) > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Evicciones en cache de Nessie"
          description: "Se detectan evicciones recientes en la cache de objetos."
      - alert: NessiePersistLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(nessie_storage_persist_seconds_bucket{application="Nessie"}[5m])) by (le, method)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Persistencia lenta en Nessie"
          description: "La latencia P95 de persistencia supera 1 segundo."
      - alert: NessieVersionStoreLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(nessie_versionstore_request_seconds_bucket{application="Nessie"}[5m])) by (le, method)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Version store lento en Nessie"
          description: "La latencia P95 del VersionStore supera 1 segundo."
      - alert: NessieHttpActiveRequestsHigh
        expr: http_server_active_requests{application="Nessie",server_port="19120"} > 50
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Muchas solicitudes activas en Nessie"
          description: "El servidor HTTP tiene más de 50 solicitudes activas de forma sostenida."
    - name: jupyter
      rules:
      - alert: JupyterNotReady
        expr: sum(kube_pod_container_status_ready{namespace="jupyter",pod=~"jupyter-scipy-notebook.*",condition="true"}) < 1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Jupyter Notebook indisponible"
          description: "El pod de Jupyter en `namespace=jupyter` no está listo. Comprueba el pod `jupyter-scipy-notebook` y sus dependencias."
      - alert: JupyterPodRestarts
        expr: increase(kube_pod_container_status_restarts_total{namespace="jupyter",pod=~"jupyter-scipy-notebook.*"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Jupyter Notebook reiniciado"
          description: "El pod de Jupyter ha reiniciado recientemente. Revisa el log para identificar errores de arranque o consumo de recursos."
    - name: postgres
      rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter caído"
          description: "El exporter de Postgres no responde; se pierden métricas."
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count{server="postgresql.bi-infra.svc.cluster.local:5432"}) > (0.8 * max(pg_settings_max_connections{server="postgresql.bi-infra.svc.cluster.local:5432"}))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conexiones altas en Postgres"
          description: "El total de conexiones supera el 80% del límite `max_connections`."
      - alert: PostgresIdleInTxHigh
        expr: sum(pg_stat_activity_count{server="postgresql.bi-infra.svc.cluster.local:5432",state="idle in transaction"}) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Conexiones idle in transaction"
          description: "Hay más de 5 conexiones en estado `idle in transaction` por más de 10 minutos."
      - alert: PostgresLongRunningTx
        expr: max(pg_stat_activity_max_tx_duration{server="postgresql.bi-infra.svc.cluster.local:5432",state="active"}) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Transacciones largas en Postgres"
          description: "Se detectan transacciones activas con más de 5 minutos."
      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{server="postgresql.bi-infra.svc.cluster.local:5432"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deadlocks detectados"
          description: "Se registraron deadlocks en los últimos 5 minutos."
      - alert: PostgresReplicationLag
        expr: pg_replication_lag_seconds{server="postgresql.bi-infra.svc.cluster.local:5432"} > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lag de replicación alto"
          description: "El lag de replicación supera 30s. Revisa el estado de la réplica."
      - alert: PostgresCacheHitLow
        expr: (sum(rate(pg_stat_database_blks_read{server="postgresql.bi-infra.svc.cluster.local:5432"}[5m])) / (sum(rate(pg_stat_database_blks_read{server="postgresql.bi-infra.svc.cluster.local:5432"}[5m])) + sum(rate(pg_stat_database_blks_hit{server="postgresql.bi-infra.svc.cluster.local:5432"}[5m])))) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache hit ratio bajo"
          description: "El porcentaje de lecturas desde disco supera 20% del total de lecturas."
      - alert: PostgresCheckpointSyncHigh
        expr: increase(pg_stat_bgwriter_checkpoint_sync_time_total[5m]) > 60000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Checkpoint lento"
          description: "El tiempo de sync de checkpoints supera 60s en los últimos 5 minutos."
      - alert: PostgresLocksHigh
        expr: sum(pg_locks_count{server="postgresql.bi-infra.svc.cluster.local:5432"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cantidad de locks alta"
          description: "Hay más de 100 locks activos en el servidor."
      - alert: PostgresLockConflicts
        expr: increase(pg_stat_database_conflicts_confl_lock{server="postgresql.bi-infra.svc.cluster.local:5432"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conflictos por locks"
          description: "Se detectaron conflictos por locks en los últimos 5 minutos."
    - name: vault
      rules:
      - alert: VaultDown
        expr: up{job="vault"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault caído"
          description: "El target de Vault no responde en Prometheus."
      - alert: VaultSealed
        expr: vault_seal_status == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Vault sellado"
          description: "La bóveda de Vault está sellada (`vault_seal_status == 1`), por lo que no se pueden leer secretos. Inícialo y apunta los tokens."
      - alert: VaultUnsealed
        expr: vault_seal_status == 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Vault des-sellado"
          description: "Vault está desbloqueado y listo (`vault_seal_status == 0`). Este alert se usa para monitorear cambios en el estado de sellado."
      - alert: VaultAuditFailures
        expr: increase(vault_audit_failed_calls_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Errores de auditoría en Vault"
          description: "Se detectaron fallos en audit logs en los últimos 5 minutos."
      - alert: VaultHttp5xx
        expr: rate(vault_http_request_total{code=~"5.."}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Respuestas 5xx en Vault"
          description: "Vault está respondiendo con errores HTTP 5xx."
      - alert: VaultLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(vault_api_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latencia alta en Vault"
          description: "El p95 de las peticiones excede 1s."
      - alert: VaultStorageNearQuota
        expr: vault_storage_used_bytes / vault_storage_quota_bytes > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Storage de Vault cerca del límite"
          description: "El uso de storage supera el 90% de la cuota."
      - alert: VaultMemoryHigh
        expr: (container_memory_working_set_bytes{namespace="vault",pod=~"vault.*"} / container_spec_memory_limit_bytes{namespace="vault",pod=~"vault.*"}) > 0.9 and container_spec_memory_limit_bytes{namespace="vault",pod=~"vault.*"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memoria alta en Vault"
          description: "El uso de RAM supera el 90% del límite del contenedor."
      - alert: VaultPodRestarts
        expr: increase(kube_pod_container_status_restarts_total{namespace="vault",pod=~"vault.*"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Reinicios en Vault"
          description: "El pod de Vault reinició recientemente."
      - alert: VaultTokenExpirationsHigh
        expr: increase(vault_token_expiration_seconds_sum[5m]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Tokens expirando en Vault"
          description: "Se registraron expiraciones de tokens recientemente."

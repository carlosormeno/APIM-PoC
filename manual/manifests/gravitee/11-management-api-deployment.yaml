apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-management-api
  namespace: apim-gravitee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gravitee-management-api
  template:
    metadata:
      labels:
        app: gravitee-management-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "apim-gravitee"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-secret-mongo: "kv/apim/gravitee/mongo"
        vault.hashicorp.com/agent-inject-template-mongo: |
          {{- with secret "kv/apim/gravitee/mongo" -}}
          {{ .Data.data.password }}
          {{- end -}}
    spec:
      initContainers:
      - name: render-config
        image: alpine:3.20
        command:
          - sh
          - -c
          - |
            set -e
            MONGO_PW=$(cat /vault/secrets/mongo)
            sed "s/__MONGO_PASSWORD__/${MONGO_PW}/g" /config-template/gravitee.yml.tpl > /config/gravitee.yml
        volumeMounts:
        - name: config-template
          mountPath: /config-template
        - name: config
          mountPath: /config
      containers:
      - name: management-api
        image: graviteeio/apim-management-api:4.10.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: console_ui_url
          value: "https://apim-gravitee.local:31443"
        - name: console_api_url
          value: "https://apim-gravitee.local:31443/management"
        - name: portal_ui_url
          value: "https://portal-gravitee.local:31443"
        - name: gravitee_adminAccountEnable
          value: "true"
        - name: gravitee_adminPasswordBcrypt
          value: "$2a$10$Ihk05VSds5rUSgMdsMVi9OKMIx2yUvMz7y9VP3rJmQeizZLrhLMyq"
        startupProbe:
          tcpSocket:
            port: 8083
          failureThreshold: 30
          periodSeconds: 5
          timeoutSeconds: 1
        readinessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 6
        volumeMounts:
        - name: config
          mountPath: /opt/graviteeio-management-api/config/gravitee.yml
          subPath: gravitee.yml
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1
            memory: 2Gi
      volumes:
      - name: config-template
        configMap:
          name: gravitee-management-config
      - name: config
        emptyDir: {}

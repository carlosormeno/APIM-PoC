apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-fast
  namespace: poc-backends
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-fast
  template:
    metadata:
      labels:
        app: svc-fast
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: MODE
          value: fast
        - name: SERVICE_NAME
          value: svc-fast
        - name: PORT
          value: "8080"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
        command: ["python", "/app/app.py"]
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: app
        configMap:
          name: poc-backend-app
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: svc-fast
  namespace: poc-backends
spec:
  selector:
    app: svc-fast
  ports:
  - name: http
    port: 80
    targetPort: 8080

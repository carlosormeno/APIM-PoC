apiVersion: v1
kind: ConfigMap
metadata:
  name: poc-backend-app
  namespace: poc-backends
data:
  app.py: |
    import json
    import os
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse, parse_qs

    MODE = os.getenv("MODE", "fast")
    SERVICE_NAME = os.getenv("SERVICE_NAME", "svc-fast")
    PORT = int(os.getenv("PORT", "8080"))
    SLOW_MS = int(os.getenv("SLOW_MS", "200"))
    ERROR_CODE = int(os.getenv("ERROR_CODE", "500"))

    def openapi_spec():
        return {
            "openapi": "3.0.3",
            "info": {
                "title": f"PoC Backend - {SERVICE_NAME}",
                "version": "1.0.0",
                "description": "PoC backend for APIM comparison (fast/slow/error).",
            },
            "servers": [
                {"url": f"http://{SERVICE_NAME}.poc-backends.svc.cluster.local:{PORT}"}
            ],
            "paths": {
                "/": {
                    "get": {
                        "summary": "Main endpoint",
                        "responses": {
                            "200": {"description": "OK"},
                            "500": {"description": "Error"},
                        },
                    }
                },
                "/healthz": {
                    "get": {
                        "summary": "Health check",
                        "responses": {"200": {"description": "OK"}},
                    }
                },
                "/openapi.json": {
                    "get": {
                        "summary": "OpenAPI document",
                        "responses": {"200": {"description": "OK"}},
                    }
                },
            },
        }

    class Handler(BaseHTTPRequestHandler):
        def _write_json(self, code, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            parsed = urlparse(self.path)
            if parsed.path == "/healthz":
                return self._write_json(200, {"status": "ok"})

            if parsed.path == "/openapi.json":
                return self._write_json(200, openapi_spec())

            if MODE == "slow":
                qs = parse_qs(parsed.query)
                delay_ms = int(qs.get("delay_ms", [SLOW_MS])[0])
                time.sleep(delay_ms / 1000.0)
                return self._write_json(200, {"mode": "slow", "delay_ms": delay_ms})

            if MODE == "error":
                return self._write_json(ERROR_CODE, {"mode": "error", "status": ERROR_CODE})

            return self._write_json(200, {"mode": "fast"})

        def log_message(self, fmt, *args):
            # Keep logs concise; APIM should handle request logging.
            return

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", PORT), Handler)
        server.serve_forever()

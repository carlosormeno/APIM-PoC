global:
  # Habilita TLS en despliegues reales. Ajusta a false mientras generas certificados.
  tlsDisable: true

server:
  dev:
    enabled: false

  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: local-path

ui:
  enabled: true

data:
  airflow-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Paneles clave de Airflow para scheduler, executor y pools m\u00e1s alertas b\u00e1sicas para fallos y saturaci\u00f3n.",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "iteration": 1,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "airflow_scheduler_tasks{state=\"executable\"}",
              "legendFormat": "Ejecutables",
              "refId": "A"
            },
            {
              "expr": "airflow_scheduler_tasks{state=\"starving\"}",
              "legendFormat": "Starving",
              "refId": "B"
            }
          ],
          "title": "Scheduler queues",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  }
                ]
              },
              "unit": "tasks"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "airflow_executor_queued_tasks",
              "legendFormat": "En cola",
              "refId": "A"
            },
            {
              "expr": "airflow_executor_running_tasks",
              "legendFormat": "En ejecuci\u00f3n",
              "refId": "B"
            }
          ],
          "title": "Executor queue",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "slots"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "id": 3,
          "targets": [
            {
              "expr": "airflow_pool_open_slots",
              "legendFormat": "Slots abiertos",
              "refId": "A"
            },
            {
              "expr": "airflow_pool_used_slots",
              "legendFormat": "Slots usados",
              "refId": "B"
            }
          ],
          "title": "Pool slots",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "id": 4,
          "targets": [
            {
              "expr": "rate(airflow_operator_failures_total[5m])",
              "legendFormat": "Failures",
              "refId": "A"
            },
            {
              "expr": "rate(airflow_operator_successes_total[5m])",
              "legendFormat": "Successes",
              "refId": "B"
            }
          ],
          "title": "Operator results",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "id": 5,
          "targets": [
            {
              "expr": "airflow_dagrun_duration_seconds{quantile=\"0.5\"}",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "expr": "airflow_dagrun_duration_seconds{quantile=\"0.95\"}",
              "legendFormat": "P95",
              "refId": "B"
            }
          ],
          "title": "Duraci\u00f3n DAG runs",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "id": 6,
          "targets": [
            {
              "expr": "airflow_dagbag_size",
              "legendFormat": "DAGs cargados",
              "refId": "A"
            }
          ],
          "title": "DAG bag size",
          "type": "stat"
        }
      ],
      "schemaVersion": 36,
      "style": "dark",
      "tags": [
        "airflow",
        "orchestration"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Airflow - Orchestrator health",
      "uid": "airflow-monitoring"
    }
  airflow-loki-basic-dashboard.json: |

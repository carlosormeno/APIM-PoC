# Gravitee APIM 4.10.3 - values.yaml (template)
# Ajustar claves exactas según chart de Gravitee usado.

image:
  # TODO: fijar tag 4.10.3
  tag: "4.10.3"

ingress:
  enabled: true
  hosts:
    - host: apim-gravitee.local
      paths:
        - /
  tls:
    - secretName: gravitee-tls
      hosts:
        - apim-gravitee.local

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

# Vault Agent Injector (anotar deployments/pods en manifest del chart)
# Ruta sugerida: /vault/secrets/
# Archivo esperado: /vault/secrets/admin
vault:
  enabled: true
  mountPath: /vault/secrets

management:
  additionalProperties:
    security:
      providers:
        - type: memory
          users:
            - username: admin
              password: ${file:/vault/secrets/admin}
              roles: ORGANIZATION:ADMIN,ENVIRONMENT:ADMIN
        - type: oidc
          id: oidc
          clientId: ${file:/vault/secrets/oidc_client_id}
          clientSecret: ${file:/vault/secrets/oidc_client_secret}
          authorizationEndpoint: https://idp.example.com/oauth2/authorize
          tokenEndpoint: https://idp.example.com/oauth2/token
          userInfoEndpoint: https://idp.example.com/oauth2/userinfo
          jwkSetUri: https://idp.example.com/.well-known/jwks.json
          issuer: https://idp.example.com/
          scope: openid profile email
          userMapping:
            id: sub
            email: email
            firstname: given_name
            lastname: family_name
          roleMapping:
            - condition: "{#jsonPath(#profile,'$.roles') contains 'admin'}"
              roles: ORGANIZATION:ADMIN,ENVIRONMENT:ADMIN
          syncMapping: true
